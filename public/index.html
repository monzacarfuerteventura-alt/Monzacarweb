<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monzacar - Tu Concesionario Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar h1 {
            font-size: 28px;
        }

        .admin-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .admin-btn:hover {
            transform: scale(1.05);
        }

        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 40px;
            color: #333;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .car-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .car-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .car-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #e0e0e0;
        }

        .car-content {
            padding: 20px;
        }

        .car-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #667eea;
        }

        .car-specs {
            font-size: 13px;
            color: #777;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .car-specs div {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .car-price {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin: 15px 0;
        }

        .car-description {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            min-height: 40px;
        }

        .car-actions {
            display: flex;
            gap: 10px;
        }

        .btn-contact {
            flex: 1;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn-contact:hover {
            background: #5568d3;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .hero h2 {
                font-size: 24px;
            }

            .cars-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🚗 Monzacar</h1>
        <button class="admin-btn" onclick="goToAdmin()">⚙️ Panel Admin</button>
    </div>

    <div class="hero">
        <h2>Bienvenido a Monzacar</h2>
        <p>Tu concesionario online con los mejores coches</p>
    </div>

    <div class="container">
        <h2 class="section-title">🚗 Coches Disponibles</h2>
        <div id="carsList" class="cars-grid">
            <div class="empty-state">
                <h3>Cargando coches...</h3>
                <p>Por favor espera un momento</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2024 Monzacar - Todos los derechos reservados</p>
    </div>

    <script>
        // Cargar coches cuando se abre la página
        loadCars();

        function loadCars() {
            const cars = JSON.parse(localStorage.getItem('monzacarCars')) || [];
            const carsList = document.getElementById('carsList');

            if (cars.length === 0) {
                carsList.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <h3>📭 No hay coches disponibles</h3>
                        <p>Vuelve pronto para ver nuestras nuevas ofertas</p>
                    </div>
                `;
                return;
            }

            carsList.innerHTML = cars.map(car => `
                <div class="car-card">
                    <img src="${car.imagen}" alt="${car.marca} ${car.modelo}" class="car-image">
                    <div class="car-content">
                        <div class="car-title">${car.marca} ${car.modelo}</div>

                        <div class="car-specs">
                            <div>
                                <span>📅 Año:</span>
                                <strong>${car.ano}</strong>
                            </div>
                            <div>
                                <span>🛣️ Kilometraje:</span>
                                <strong>${car.kilometraje.toLocaleString('es-ES')} km</strong>
                            </div>
                            <div>
                                <span>🎨 Color:</span>
                                <strong>${car.color}</strong>
                            </div>
                            <div>
                                <span>⛽ Combustible:</span>
                                <strong>${car.combustible}</strong>
                            </div>
                        </div>

                        <div class="car-price">${car.precio.toLocaleString('es-ES')} €</div>

                        ${car.descripcion ? `<div class="car-description">${car.descripcion}</div>` : ''}

                        <div class="car-actions">
                            <button class="btn-contact" onclick="contactarPorCoche('${car.marca} ${car.modelo}')">
                                📞 Contactar
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function goToAdmin() {
            window.location.href = '/admin.html';
        }

        function contactarPorCoche(modelo) {
            alert(`¡Gracias por tu interés en el ${modelo}!\n\nPuedes contactarnos al:\n📞 +34 123 456 789\n📧 info@monzacar.com`);
        }
    </script>
</body>
</html>
