<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel de coches — Monzacar</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23142452'/%3E%3Crect x='20' y='40' width='22' height='22' fill='%23f2701e'/%3E%3C/svg%3E" />
<style>
  :root{
    --navy:#142452; --navy-2:#1e3a8a; --navy-soft:#eef1fb; --orange:#f2701e; --orange-dark:#d85e12;
    --ink:#151a2e; --muted:#5b6178; --line:#e3e6f0; --bg-alt:#f6f7fc; --radius:14px;
    --danger:#dc2626; --ok:#1f9d55;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg-alt);color:var(--ink);}
  a{color:inherit;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* Login */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(1100px 500px at 85% -10%, #24398f 0%, var(--navy) 55%, #0e1a3d 100%);}
  .login-card{background:#fff;border-radius:20px;padding:36px 30px;max-width:380px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);}
  .login-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;color:var(--navy);margin-bottom:6px;}
  .login-logo .sq{width:13px;height:13px;background:var(--orange);border-radius:3px;}
  .login-logo b{color:var(--orange);}
  .login-card p.sub{color:var(--muted);font-size:14px;margin:0 0 22px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;background:#fbfcfe;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--navy-2);background:#fff;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;font-weight:700;font-size:14.5px;border:2px solid transparent;text-decoration:none;}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-block{width:100%;}
  .btn-outline{background:#fff;color:var(--navy);border-color:var(--line);}
  .btn-outline:hover{border-color:var(--navy-2);}
  .btn-danger{background:#fff;color:var(--danger);border-color:#fecaca;}
  .btn-danger:hover{background:#fef2f2;}
  .btn-sm{padding:8px 12px;font-size:13px;}
  .error-msg{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:14px;}
  .ok-msg{background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0;padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:14px;}

  /* App shell */
  #appView header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .app-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;}
  .app-logo .sq{width:11px;height:11px;background:var(--orange);border-radius:3px;}
  .app-logo b{color:var(--orange);}
  #appView main{max-width:1080px;margin:0 auto;padding:24px 18px 60px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  .toolbar h1{font-size:20px;margin:0;}
  .toolbar p{margin:2px 0 0;color:var(--muted);font-size:13.5px;}

  .car-row{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px;}
  .car-row .thumb{width:78px;height:60px;border-radius:10px;background:var(--navy-soft);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--navy-2);font-size:10px;font-weight:700;}
  .car-row .thumb img{width:100%;height:100%;object-fit:cover;}
  .car-row .info{flex:1;min-width:0;}
  .car-row .info .t{font-weight:800;font-size:15px;}
  .car-row .info .m{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;}
  .badge.on{background:#f0fdf4;color:var(--ok);}
  .badge.off{background:#f3f4f6;color:#9ca3af;}
  .badge.star{background:#fff7ed;color:var(--orange-dark);}
  .row-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0;}
  .row-actions .line{display:flex;gap:6px;}
  .iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .empty-state{background:#fff;border:1px dashed var(--line);border-radius:var(--radius);padding:50px 20px;text-align:center;color:var(--muted);}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,14,32,.55);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;}
  .modal-backdrop.open{display:flex;}
  .modal{background:#fff;border-radius:18px;max-width:640px;width:100%;padding:26px;margin:20px 0;}
  .modal h2{margin:0 0 18px;font-size:19px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .switch-row{display:flex;gap:20px;margin:6px 0 18px;flex-wrap:wrap;}
  .switch{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
  .switch input{width:18px;height:18px;}
  .photo-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .photo-thumb{position:relative;width:84px;height:64px;border-radius:8px;overflow:hidden;background:var(--navy-soft);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;}
  .upload-box{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;}
  .upload-box:hover{border-color:var(--navy-2);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:640px){
    .field-row, .field-row3{grid-template-columns:1fr;}
    .car-row{flex-wrap:wrap;}
    .row-actions{width:100%;flex-direction:row;justify-content:flex-start;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView">
  <div class="login-card">
    <div class="login-logo"><span class="sq"></span>MONZA<b>CAR</b></div>
    <p class="sub">Panel de gestión de coches</p>
    <div id="loginError" class="error-msg hidden"></div>
    <form id="loginForm">
      <div class="field">
        <label>Usuario</label>
        <input type="text" id="loginUser" autocomplete="username" required />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="loginPass" autocomplete="current-password" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Entrar</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <header>
    <div class="app-logo"><span class="sq"></span>MONZA<b>CAR</b> · panel</div>
    <button class="btn btn-outline btn-sm" id="logoutBtn" style="background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3);">Salir</button>
  </header>
  <main>
    <div class="toolbar">
      <div>
        <h1>Coches</h1>
        <p>Publica, edita u oculta vehículos. Los cambios se reflejan al instante en la web.</p>
      </div>
      <button class="btn btn-primary" id="newCarBtn">+ Añadir coche</button>
    </div>
    <div id="carsList"></div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">Añadir coche</h2>
    <div id="formError" class="error-msg hidden"></div>
    <form id="carForm">
      <input type="hidden" id="carId" />
      <div class="field-row3">
        <div class="field"><label>Marca</label><input id="f_marca" required /></div>
        <div class="field"><label>Modelo</label><input id="f_modelo" required /></div>
        <div class="field"><label>Versión</label><input id="f_version" /></div>
      </div>
      <div class="field-row3">
        <div class="field"><label>Año</label><input id="f_anio" placeholder="2019" /></div>
        <div class="field"><label>Kilómetros</label><input id="f_km" placeholder="95.000 km" /></div>
        <div class="field"><label>Precio (€)</label><input id="f_precio" placeholder="12900" /></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Combustible</label>
          <select id="f_combustible">
            <option value="">—</option>
            <option>Gasolina</option>
            <option>Diésel</option>
            <option>Híbrido</option>
            <option>Eléctrico</option>
            <option>GLP</option>
          </select>
        </div>
        <div class="field">
          <label>Cambio</label>
          <select id="f_cambio">
            <option value="">—</option>
            <option>Manual</option>
            <option>Automático</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="f_descripcion" rows="3" placeholder="Estado general, extras, historial..."></textarea>
      </div>

      <div class="switch-row">
        <label class="switch"><input type="checkbox" id="f_garantia" /> Garantía 12 meses</label>
        <label class="switch"><input type="checkbox" id="f_destacado" /> Destacado</label>
        <label class="switch"><input type="checkbox" id="f_publicado" checked /> Publicado en la web</label>
      </div>

      <label style="display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:8px;">Fotos (URLs)</label>
      <div class="photo-grid" id="photoGrid"></div>
      <div class="field">
        <label>Añadir foto (pega la URL)</label>
        <input type="url" id="f_foto_url" placeholder="https://ejemplo.com/foto.jpg" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Guardar coche</button>
      </div>
    </form>
  </div>
</div>

<script>
  const VALID_USERNAME = "Monzacar2026";
  const VALID_PASSWORD = "16079219Aa";

  let token = localStorage.getItem('mz_admin_token') || '';
  let cars = [];
  let currentPhotos = [];
  let editingId = null;

  const loginView = document.getElementById('loginView');
  const appView = document.getElementById('appView');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');

  function showApp(){
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
    loadCars();
  }
  function showLogin(msg){
    appView.classList.add('hidden');
    loginView.classList.remove('hidden');
    if(msg){
      loginError.textContent = msg;
      loginError.classList.remove('hidden');
    }
  }

  if(token){ showApp(); } else { showLogin(); }

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    loginError.classList.add('hidden');
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;

    if(user === VALID_USERNAME && pass === VALID_PASSWORD){
      token = 'token_' + Date.now();
      localStorage.setItem('mz_admin_token', token);
      loginForm.reset();
      showApp();
    } else {
      loginError.textContent = 'Usuario o contraseña incorrectos';
      loginError.classList.remove('hidden');
      document.getElementById('loginPass').value = '';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    token = '';
    localStorage.removeItem('mz_admin_token');
    loginForm.reset();
    showLogin();
  });

  function saveCars(){
    localStorage.setItem('mz_cars', JSON.stringify(cars));
  }

  function loadCars(){
    const list = document.getElementById('carsList');
    const stored = localStorage.getItem('mz_cars');
    cars = stored ? JSON.parse(stored) : [];
    renderCars();
  }

  function renderCars(){
    const list = document.getElementById('carsList');
    if(!cars.length){
      list.innerHTML = '<div class="empty-state">Todavía no has añadido ningún coche.<br>Pulsa "Añadir coche" para publicar el primero.</div>';
      return;
    }
    const sorted = [...cars].sort((a,b) => (a.orden ?? 0) - (b.orden ?? 0));
    list.innerHTML = '';
    sorted.forEach((car, i) => {
      const title = [car.marca, car.modelo, car.version].filter(Boolean).join(' ') || '(sin nombre)';
      const meta = [car.anio, car.km, car.precio ? car.precio + ' €' : null].filter(Boolean).join(' · ');
      const thumbUrl = car.fotos && car.fotos[0] ? car.fotos[0] : '';
      const row = document.createElement('div');
      row.className = 'car-row';
      row.innerHTML = `
        <div class="thumb">${thumbUrl ? `<img src="${thumbUrl}" />` : 'SIN FOTO'}</div>
        <div class="info">
          <div class="t">${title}</div>
          <div class="m">${meta || 'Sin datos'}</div>
          <div class="badges">
            <span class="badge ${car.publicado ? 'on' : 'off'}">${car.publicado ? 'Publicado' : 'Oculto'}</span>
            ${car.destacado ? '<span class="badge star">Destacado</span>' : ''}
            ${car.garantia ? '<span class="badge on">Garantía</span>' : ''}
          </div>
        </div>
        <div class="row-actions">
          <div class="line">
            <button class="iconbtn" data-act="up" title="Subir orden">↑</button>
            <button class="iconbtn" data-act="down" title="Bajar orden">↓</button>
          </div>
          <div class="line">
            <button class="btn btn-outline btn-sm" data-act="toggle">${car.publicado ? 'Ocultar' : 'Publicar'}</button>
            <button class="btn btn-outline btn-sm" data-act="edit">Editar</button>
            <button class="btn btn-danger btn-sm" data-act="del">Borrar</button>
          </div>
        </div>
      `;
      row.querySelector('[data-act="toggle"]').addEventListener('click', () => togglePublicado(car));
      row.querySelector('[data-act="edit"]').addEventListener('click', () => openEdit(car));
      row.querySelector('[data-act="del"]').addEventListener('click', () => deleteCar(car));
      row.querySelector('[data-act="up"]').addEventListener('click', () => reorder(sorted, i, -1));
      row.querySelector('[data-act="down"]').addEventListener('click', () => reorder(sorted, i, 1));
      list.appendChild(row);
    });
  }

  function togglePublicado(car){
    car.publicado = !car.publicado;
    saveCars();
    renderCars();
  }

  function reorder(sorted, i, dir){
    const j = i + dir;
    if(j < 0 || j >= sorted.length) return;
    const a = sorted[i], b = sorted[j];
    const ordenA = a.orden ?? 0, ordenB = b.orden ?? 0;
    a.orden = ordenB;
    b.orden = ordenA;
    saveCars();
    renderCars();
  }

  function deleteCar(car){
    const title = [car.marca, car.modelo].filter(Boolean).join(' ') || 'este coche';
    if(!confirm(`¿Seguro que quieres borrar ${title}? Esta acción no se puede deshacer.`)) return;
    cars = cars.filter(c => c.id !== car.id);
    saveCars();
    renderCars();
  }

  // ----- Modal -----
  const modalBackdrop = document.getElementById('modalBackdrop');
  const carForm = document.getElementById('carForm');
  const formError = document.getElementById('formError');
  const photoGrid = document.getElementById('photoGrid');

  document.getElementById('newCarBtn').addEventListener('click', openNew);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', (e) => { if(e.target === modalBackdrop) closeModal(); });

  function openNew(){
    editingId = null;
    currentPhotos = [];
    document.getElementById('modalTitle').textContent = 'Añadir coche';
    carForm.reset();
    document.getElementById('f_publicado').checked = true;
    renderPhotoGrid();
    formError.classList.add('hidden');
    modalBackdrop.classList.add('open');
  }

  function openEdit(car){
    editingId = car.id;
    currentPhotos = [...(car.fotos || [])];
    document.getElementById('modalTitle').textContent = 'Editar coche';
    document.getElementById('f_marca').value = car.marca || '';
    document.getElementById('f_modelo').value = car.modelo || '';
    document.getElementById('f_version').value = car.version || '';
    document.getElementById('f_anio').value = car.anio || '';
    document.getElementById('f_km').value = car.km || '';
    document.getElementById('f_precio').value = car.precio || '';
    document.getElementById('f_combustible').value = car.combustible || '';
    document.getElementById('f_cambio').value = car.cambio || '';
    document.getElementById('f_descripcion').value = car.descripcion || '';
    document.getElementById('f_garantia').checked = !!car.garantia;
    document.getElementById('f_destacado').checked = !!car.destacado;
    document.getElementById('f_publicado').checked = !!car.publicado;
    renderPhotoGrid();
    formError.classList.add('hidden');
    modalBackdrop.classList.add('open');
  }

  function closeModal(){
    modalBackdrop.classList.remove('open');
  }

  function renderPhotoGrid(){
    photoGrid.innerHTML = '';
    currentPhotos.forEach((url, i) => {
      const div = document.createElement('div');
      div.className = 'photo-thumb';
      div.innerHTML = `<img src="${url}" /><button type="button" class="rm">&times;</button>`;
      div.querySelector('.rm').addEventListener('click', (e) => {
        e.preventDefault();
        currentPhotos.splice(i, 1);
        renderPhotoGrid();
      });
      photoGrid.appendChild(div);
    });
  }

  document.getElementById('f_foto_url').addEventListener('keypress', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      const url = document.getElementById('f_foto_url').value.trim();
      if(url){
        currentPhotos.push(url);
        document.getElementById('f_foto_url').value = '';
        renderPhotoGrid();
      }
    }
  });

  carForm.addEventListener('submit', (e) => {
    e.preventDefault();
    formError.classList.add('hidden');
    const payload = {
      marca: document.getElementById('f_marca').value.trim(),
      modelo: document.getElementById('f_modelo').value.trim(),
      version: document.getElementById('f_version').value.trim(),
      anio: document.getElementById('f_anio').value.trim(),
      km: document.getElementById('f_km').value.trim(),
      precio: document.getElementById('f_precio').value.trim(),
      combustible: document.getElementById('f_combustible').value,
      cambio: document.getElementById('f_cambio').value,
      descripcion: document.getElementById('f_descripcion').value.trim(),
      garantia: document.getElementById('f_garantia').checked,
      destacado: document.getElementById('f_destacado').checked,
      publicado: document.getElementById('f_publicado').checked,
      fotos: currentPhotos,
    };

    if(!payload.marca || !payload.modelo){
      formError.textContent = 'Marca y modelo son obligatorios';
      formError.classList.remove('hidden');
      return;
    }

    if(editingId){
      const car = cars.find(c => c.id === editingId);
      if(car) Object.assign(car, payload);
    } else {
      payload.id = 'car_' + Date.now();
      payload.orden = cars.length;
      cars.push(payload);
    }

    saveCars();
    closeModal();
    renderCars();
  });
</script>

</body>
</html>
